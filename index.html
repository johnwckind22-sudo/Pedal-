<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>PedalPay</title>

<meta name="theme-color" content="#0A0B1F" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PedalPay" />

<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<link rel="manifest" href="manifest.json" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #05060F; height: 100%; overscroll-behavior: none; }
  body { font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; }
  .display { font-family: 'Fredoka', sans-serif; }

  #frame {
    position: relative;
    width: 100vw;
    height: 100vh;
    max-width: 480px;
    background: #0A0B1F;
    overflow: hidden;
  }
  @media (min-width: 481px) {
    #frame { width: 390px; height: 780px; margin: 24px; border-radius: 34px; border: 1px solid #1E2358; box-shadow: 0 30px 80px rgba(0,0,0,0.55); }
  }

  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
  .hidden { display: none !important; }

  /* header */
  .home-header { padding: max(24px, env(safe-area-inset-top)) 24px 8px; }
  .brand { font-size: 22px; font-weight: 600; color: #F4F6FF; }
  .brand-sub { font-size: 12px; color: #8C90C4; margin-left: 8px; }

  .wheel-wrap { display:flex; flex-direction:column; align-items:center; padding: 18px 24px 0; }
  .ring-box { position: relative; width: 176px; height: 176px; }
  .ring-inner {
    position: absolute; inset: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #232867, #12143A 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .bike-icon { transform-origin: 50% 50%; }
  .spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }

  .balance { font-size: 40px; font-weight: 700; color: #F4F6FF; letter-spacing: -0.5px; text-align:center; margin-top: 20px; }
  .subline { font-size: 13px; color: #8C90C4; text-align:center; margin-top: 2px; }
  .hint { font-size: 12px; color: #8C90C4; text-align:center; margin-top: 6px; }

  .pedal-btn {
    margin-top: 18px; width: 100%; max-width: 280px; padding: 15px 0; border-radius: 16px; border: none;
    cursor: pointer; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 16px;
    background: linear-gradient(135deg, #FFD873, #FFC857); color: #1A1330;
    box-shadow: 0 8px 24px rgba(255,200,87,0.28); transition: transform 0.12s ease;
  }
  .pedal-btn.active { background: linear-gradient(135deg, #2A2F6E, #1E2358); color: #B9BDEE; box-shadow: none; }
  .pedal-btn:active { transform: scale(0.97); }

  /* bottom nav */
  .bottom-nav { display: flex; border-top: 1px solid #1E2358; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
  .nav-item { flex: 1; border: none; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; color: #5D6199; }
  .nav-item.active { color: #FFC857; }
  .nav-item span { font-size: 11px; font-weight: 600; }

  /* rewards header */
  .rewards-header { display:flex; align-items:center; padding: max(24px, env(safe-area-inset-top)) 20px 4px; position: relative; }
  .back-btn { width: 38px; height: 38px; border-radius: 12px; border: none; background: #1B2150; display:flex; align-items:center; justify-content:center; cursor: pointer; }
  .rewards-title { position: absolute; left: 0; right: 0; text-align: center; font-size: 20px; font-weight: 600; color: #F4F6FF; pointer-events: none; }
  .balance-line { padding: 10px 20px 4px; font-size: 13px; color: #8C90C4; text-align: center; }
  .balance-line b { color: #34F5C5; font-weight: 600; }

  .grid { flex: 1; overflow-y: auto; padding: 16px 18px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tier-card {
    background: #12143A; border: 1px solid #1E2358; border-radius: 20px; padding: 22px 10px 16px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; transition: transform 0.15s ease, filter 0.15s ease;
  }
  .tier-card:active { transform: scale(0.96); }
  .tier-card.locked { filter: grayscale(0.55) opacity(0.75); }
  .tier-card.shake { animation: shake 0.4s ease; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }

  .tier-ring { position: relative; width: 96px; height: 96px; }
  .tier-ring-outer { position:absolute; inset:0; border-radius:50%; padding:6px; background: linear-gradient(135deg,#3A3F72,#2A2E5C); }
  .tier-card:not(.locked) .tier-ring-outer { background: linear-gradient(135deg,#34F5C5,#22D3EE); }
  .tier-ring-inner { width:100%; height:100%; border-radius:50%; background: radial-gradient(circle at 35% 30%,#232867,#10122E 75%); display:flex; align-items:center; justify-content:center; }
  .tier-amount { font-size: 25px; font-weight: 700; color: #F4F6FF; }
  .tier-badge { position:absolute; top:-2px; right:-2px; width:26px; height:26px; border-radius:50%; background:#22D3EE; display:flex; align-items:center; justify-content:center; border: 2px solid #0A0B1F; }
  .tier-note { margin-top: 12px; font-size: 12.5px; color: #B9BDEE; text-align: center; line-height: 1.35; }

  .history-card { grid-column: 1 / -1; margin-top: 6px; background: #12143A; border: 1px solid #1E2358; border-radius: 16px; padding: 14px 16px; }
  .history-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:13px; font-weight:600; color:#F4F6FF; }
  .history-row { display:flex; justify-content: space-between; font-size: 12.5px; color:#8C90C4; padding: 4px 0; }
  .history-row b { color:#34F5C5; font-weight: 600; }

  /* modal */
  .modal-backdrop { position: absolute; inset: 0; background: rgba(6,7,20,0.6); display: flex; align-items: flex-end; z-index: 10; }
  .sheet { width: 100%; background: #12143A; border-top: 1px solid #1E2358; border-top-left-radius: 26px; border-top-right-radius: 26px; padding: 22px 22px calc(22px + env(safe-area-inset-bottom)); animation: sheetUp 0.3s ease-out; }
  @keyframes sheetUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .sheet-head { display:flex; justify-content: space-between; align-items:center; }
  .sheet-title { font-size: 18px; font-weight: 600; color: #F4F6FF; }
  .close-btn { width: 30px; height: 30px; border-radius: 10px; border: none; background: #1B2150; display:flex; align-items:center; justify-content:center; cursor: pointer; }
  .sheet p.note { font-size: 13px; color: #8C90C4; margin-top: 14px; line-height: 1.5; }

  .method-tabs { display:flex; gap: 8px; margin-top: 16px; }
  .method-tab { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding: 10px 0; border-radius: 12px; border: 1px solid #2A2F6E; background: #191C4A; color: #8C90C4; font-size:13px; font-weight:600; cursor:pointer; }
  .method-tab.active { border-color: #34F5C5; background: rgba(52,245,197,0.1); color: #34F5C5; }

  .field { margin-top: 12px; }
  .field label { font-size: 12px; color: #8C90C4; }
  .field-input-wrap { position: relative; margin-top: 6px; }
  .field-input-wrap svg { position: absolute; left: 14px; top: 14px; }
  .field input {
    width: 100%; background: #191C4A; border: 1px solid #2A2F6E; border-radius: 12px;
    padding: 12px 14px 12px 40px; color: #F4F6FF; font-size: 14px; font-family: 'Inter', sans-serif;
  }
  .field input:focus { outline: none; border-color: #34F5C5; }
  .field-error { font-size: 12px; color: #FF8A8A; margin-top: 6px; }

  .primary-btn { width: 100%; margin-top: 18px; padding: 14px 0; border-radius: 14px; border: none; cursor: pointer;
    background: linear-gradient(135deg, #34F5C5, #22D3EE); color: #0A0B1F; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 15px; }

  .center-col { display:flex; flex-direction:column; align-items:center; }
  .spinner { animation: spin 0.9s linear infinite; }
  .processing-text { margin-top: 14px; font-size: 14px; color: #B9BDEE; }
  .success-check { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #34F5C5, #22D3EE); display:flex; align-items:center; justify-content:center; animation: pop 0.35s ease-out; }
  @keyframes pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  .success-title { font-size: 18px; font-weight: 600; color: #F4F6FF; margin-top: 14px; }
  .success-sub { font-size: 13px; color: #8C90C4; margin-top: 4px; text-align: center; }

  ::-webkit-scrollbar { width: 0; }
</style>
</head>
<body>

<div id="frame">

  <!-- HOME SCREEN -->
  <div class="screen" id="screen-home">
    <div class="home-header">
      <span class="display brand">PedalPay</span><span class="brand-sub">earn by riding</span>
    </div>

    <div class="wheel-wrap">
      <div class="ring-box">
        <svg width="176" height="176" viewBox="0 0 176 176" style="position:absolute; inset:0;">
          <circle cx="88" cy="88" r="54" fill="none" stroke="#191C4A" stroke-width="10"/>
          <circle id="ring-progress" cx="88" cy="88" r="54" fill="none" stroke="url(#goldGrad)" stroke-width="10"
                  stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"
                  transform="rotate(-90 88 88)" style="transition: stroke-dashoffset 0.25s linear;"/>
          <defs>
            <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFD873"/>
              <stop offset="100%" stop-color="#FFC857"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="ring-inner">
          <svg id="bike-icon" class="bike-icon" width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FFC857" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/>
            <path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="#FFC857" stroke="none"/>
            <path d="M12 17.5V14l-3-3 4-3 2 3h2"/>
          </svg>
        </div>
      </div>

      <div class="balance" id="balance-text">$1.80</div>
      <div class="subline" id="subline-text">$1.80 earned today · 0 pedal ticks</div>
      <div class="hint" id="hint-text">$3.20 more to unlock $5</div>

      <button class="pedal-btn" id="pedal-btn">Start pedaling</button>
    </div>

    <div style="flex:1;"></div>

    <div class="bottom-nav">
      <button class="nav-item active" id="nav-home"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" stroke="none"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg><span>Ride</span></button>
      <button class="nav-item" id="nav-rewards"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2 0-3.5-1.5-3.5-3S8.5 2 10 2s2 1.5 2 3M12 8c2 0 3.5-1.5 3.5-3S13.5 2 12 2s-2 1.5-2 3"/></svg><span>Rewards</span></button>
    </div>
  </div>

  <!-- REWARDS SCREEN -->
  <div class="screen hidden" id="screen-rewards">
    <div class="rewards-header">
      <button class="back-btn" id="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4F6FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <div class="display rewards-title">Cash Rewards</div>
    </div>
    <div class="balance-line">Balance: <b id="rewards-balance">$1.80</b></div>
    <div class="grid" id="grid"></div>

    <div class="bottom-nav">
      <button class="nav-item" id="nav-home-2"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" stroke="none"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg><span>Ride</span></button>
      <button class="nav-item active" id="nav-rewards-2"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8c-2 0-3.5-1.5-3.5-3S8.5 2 10 2s2 1.5 2 3M12 8c2 0 3.5-1.5 3.5-3S13.5 2 12 2s-2 1.5-2 3"/></svg><span>Rewards</span></button>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-backdrop hidden" id="modal-backdrop">
    <div class="sheet" id="sheet"></div>
  </div>

</div>

<script>
(function () {
  var TIERS = [500, 1000, 2000, 5000, 10000, 20000];
  var RING_C = 339.3;

  var state = {
    balance: 180,
    todayEarned: 180,
    pedaling: false,
    wheelTurns: 0,
    screen: 'home',
    selectedTier: null,
    step: null,
    method: 'paypal',
    email: '',
    upiId: '',
    emailTouched: false,
    upiTouched: false,
    history: [],
  };
  var pedalInterval = null;

  function formatUsd(c) { return '$' + (c / 100).toFixed(2); }
  function formatUsdWhole(c) { var v = c / 100; return v % 1 === 0 ? ('$' + v) : ('$' + v.toFixed(2)); }
  function emailValid(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function upiValid(v) { return /^[\w.\-]{2,256}@[a-zA-Z]{2,64}$/.test(v); }

  function nextTier() { for (var i=0;i<TIERS.length;i++) if (TIERS[i] > state.balance) return TIERS[i]; return TIERS[TIERS.length-1]; }
  function prevTier() { var p=0; for (var i=0;i<TIERS.length;i++) if (TIERS[i] <= state.balance) p = TIERS[i]; return p; }

  var $ = function(id){ return document.getElementById(id); };

  function renderHomeStats() {
    $('balance-text').textContent = formatUsd(state.balance);
    $('subline-text').textContent = formatUsd(state.todayEarned) + ' earned today · ' + state.wheelTurns + ' pedal ticks';
    var nt = nextTier(), pt = prevTier();
    if (state.balance >= 20000) {
      $('hint-text').textContent = 'Top tier unlocked';
    } else {
      $('hint-text').textContent = formatUsdWhole(nt - state.balance) + ' more to unlock ' + formatUsdWhole(nt);
    }
    var frac = nt === pt ? 1 : (state.balance - pt) / (nt - pt);
    $('ring-progress').setAttribute('stroke-dashoffset', String(RING_C * (1 - frac)));
  }

  function togglePedal() {
    state.pedaling = !state.pedaling;
    var btn = $('pedal-btn'), icon = $('bike-icon');
    if (state.pedaling) {
      btn.textContent = 'Stop pedaling';
      btn.classList.add('active');
      icon.classList.add('spin');
      pedalInterval = setInterval(function () {
        state.balance += 25;
        state.todayEarned += 25;
        state.wheelTurns += 1;
        renderHomeStats();
      }, 250);
    } else {
      btn.textContent = 'Start pedaling';
      btn.classList.remove('active');
      icon.classList.remove('spin');
      clearInterval(pedalInterval);
    }
  }

  function showScreen(name) {
    state.screen = name;
    $('screen-home').classList.toggle('hidden', name !== 'home');
    $('screen-rewards').classList.toggle('hidden', name !== 'rewards');
    if (name === 'rewards') renderRewards();
  }

  function renderRewards() {
    $('rewards-balance').textContent = formatUsd(state.balance);
    var grid = $('grid');
    grid.innerHTML = '';
    TIERS.forEach(function (tier) {
      var unlocked = state.balance >= tier;
      var card = document.createElement('div');
      card.className = 'tier-card' + (unlocked ? '' : ' locked');
      card.innerHTML =
        '<div class="tier-ring"><div class="tier-ring-outer"><div class="tier-ring-inner"><span class="display tier-amount">' + formatUsdWhole(tier) + '</span></div></div>' +
        (unlocked ? '<div class="tier-badge"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0A0B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' : '') +
        '</div><div class="tier-note">' + (unlocked ? 'Ready to withdraw' : 'Keep pedaling to unlock') + '</div>';
      card.addEventListener('click', function () { openTier(tier, card); });
      grid.appendChild(card);
    });

    if (state.history.length > 0) {
      var totalWithdrawn = state.history.reduce(function (s, h) { return s + h.amount; }, 0);
      var hc = document.createElement('div');
      hc.className = 'history-card';
      var rows = state.history.slice(0, 3).map(function (h) {
        return '<div class="history-row"><span>Sent to ' + (h.method === 'upi' ? 'UPI' : 'PayPal') + '</span><b>' + formatUsd(h.amount) + '</b></div>';
      }).join('');
      hc.innerHTML = '<div class="history-head">' + state.history.length + ' payout' + (state.history.length > 1 ? 's' : '') + ' sent · ' + formatUsd(totalWithdrawn) + ' total</div>' + rows;
      grid.appendChild(hc);
    }
  }

  function openTier(tier, cardEl) {
    if (state.balance >= tier) {
      state.selectedTier = tier;
      state.step = 'confirm';
      openModal();
    } else {
      cardEl.classList.add('shake');
      setTimeout(function () { cardEl.classList.remove('shake'); }, 420);
    }
  }

  function openModal() {
    $('modal-backdrop').classList.remove('hidden');
    renderModal();
  }
  function closeModal() {
    $('modal-backdrop').classList.add('hidden');
    state.step = null; state.selectedTier = null;
    state.emailTouched = false; state.upiTouched = false;
  }

  function renderModal() {
    var sheet = $('sheet');
    var tier = state.selectedTier;
    var destLabel = state.method === 'upi' ? 'UPI ID' : 'PayPal';

    if (state.step === 'confirm') {
      sheet.innerHTML =
        '<div class="sheet-head"><span class="display sheet-title">Withdraw ' + formatUsdWhole(tier) + '</span>' +
        '<button class="close-btn" id="close-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C90C4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' +
        '<div class="method-tabs">' +
          '<button class="method-tab' + (state.method === 'paypal' ? ' active' : '') + '" id="tab-paypal"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/></svg>PayPal</button>' +
          '<button class="method-tab' + (state.method === 'upi' ? ' active' : '') + '" id="tab-upi"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>UPI</button>' +
        '</div>' +
        '<p class="note">' + (state.method === 'paypal'
          ? 'This amount will be sent to your PayPal account. It usually arrives within 24 hours.'
          : 'This amount will be sent to your UPI ID. It usually arrives within a few minutes.') + '</p>' +
        (state.method === 'paypal'
          ? '<div class="field"><label>PayPal email</label><div class="field-input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/></svg><input id="email-input" type="email" placeholder="you@example.com" value="' + state.email + '"/></div>' +
            (state.emailTouched && !emailValid(state.email) ? '<div class="field-error">Enter the email linked to your PayPal account.</div>' : '') + '</div>'
          : '<div class="field"><label>UPI ID</label><div class="field-input-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5D6199" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg><input id="upi-input" type="text" placeholder="yourname@upi" value="' + state.upiId + '"/></div>' +
            (state.upiTouched && !upiValid(state.upiId) ? '<div class="field-error">Enter a valid UPI ID, like 9876543210@okhdfcbank.</div>' : '') + '</div>') +
        '<button class="primary-btn" id="confirm-btn">Confirm withdrawal</button>';

      $('close-btn').addEventListener('click', closeModal);
      $('tab-paypal').addEventListener('click', function () { state.method = 'paypal'; renderModal(); });
      $('tab-upi').addEventListener('click', function () { state.method = 'upi'; renderModal(); });
      var input = state.method === 'paypal' ? $('email-input') : $('upi-input');
      input.addEventListener('input', function (e) {
        if (state.method === 'paypal') state.email = e.target.value; else state.upiId = e.target.value;
      });
      $('confirm-btn').addEventListener('click', confirmWithdraw);
    }

    if (state.step === 'processing') {
      sheet.innerHTML =
        '<div class="center-col" style="padding: 26px 0 10px;">' +
        '<svg class="spinner" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#34F5C5" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 11-9-9"/></svg>' +
        '<div class="processing-text">Sending to ' + destLabel + '…</div></div>';
    }

    if (state.step === 'success') {
      sheet.innerHTML =
        '<div class="center-col" style="padding: 8px 0 4px;">' +
        '<div class="success-check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#0A0B1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
        '<div class="display success-title">' + formatUsdWhole(tier) + ' sent</div>' +
        '<div class="success-sub">On its way to your ' + destLabel + '. Keep pedaling — you can withdraw again as soon as you unlock the next reward.</div>' +
        '<button class="primary-btn" id="done-btn" style="margin-top:20px;">Done</button></div>';
      $('done-btn').addEventListener('click', function () { closeModal(); renderRewards(); });
    }
  }

  function confirmWithdraw() {
    if (state.method === 'paypal') {
      state.emailTouched = true;
      if (!emailValid(state.email)) { renderModal(); return; }
    } else {
      state.upiTouched = true;
      if (!upiValid(state.upiId)) { renderModal(); return; }
    }
    state.step = 'processing';
    renderModal();
    setTimeout(function () {
      state.balance -= state.selectedTier;
      state.history.unshift({
        amount: state.selectedTier,
        method: state.method,
        destination: state.method === 'paypal' ? state.email : state.upiId,
      });
      state.step = 'success';
      renderModal();
    }, 1400);
  }

  // wire up nav
  $('pedal-btn').addEventListener('click', togglePedal);
  $('nav-rewards').addEventListener('click', function () { showScreen('rewards'); });
  $('nav-home-2').addEventListener('click', function () { showScreen('home'); });
  $('back-btn').addEventListener('click', function () { showScreen('home'); });

  renderHomeStats();
})();
</script>
</body>
</html>
